[project]
name = "ask-human-mcp"
version = "0.1.0"
description = "MCP server bridging Claude Code to Slack for human-in-the-loop questions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DarkHorse InfoSec" }]
keywords = ["mcp", "claude", "slack", "human-in-the-loop"]

dependencies = [
    "mcp>=1.13.0,<2.0.0",
    "slack-sdk>=3.27.0,<4.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "structlog>=24.1.0",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.30.0",
    "anyio>=4.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-mock>=3.12.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
]

[project.scripts]
ask-human-mcp = "ask_human_mcp.server:main"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ask_human_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
